{% include "navbar.html" %}

<div style="margin-top:190px;padding:80px;max-width:1000px;margin:auto;">

<h2>Book Management</h2>

<!-- PANEL -->

<div style="display:flex;gap:10px;margin-bottom:20px;">

<button onclick="showNewBooks()" style="padding:8px 18px;font-weight:bold;">
New Books
</button>

<button onclick="showAddBook()" style="padding:18px 28px;font-weight:bold;">
Add New Book
</button>

</div>

<!-- ================= NEW BOOKS TABLE ================= -->

<div id="newBooksSection">

<table border="1" cellpadding="10" style="width:100%;text-align:left;border-collapse:collapse;">

<tr>
<th>Book</th>
<th>Edit</th>
<th>Delete</th>
</tr>

{% for book in books %}

<tr>

<td>
<a href="/book/{{ book.isbn }}" style="text-decoration:none;font-weight:bold;">
{{ book.title }}
</a>
</td>

<td>
<a href="/admin/delete-book/{{ book.id }}"
onclick="return confirm('Delete this book and re-add with changes?')">
Edit
</a>
</td>

<td>
<a href="/admin/delete-book/{{ book.id }}"
onclick="return confirm('Delete this book?')"
style="color:red;">
Delete
</a>
</td>

</tr>

{% endfor %}

</table>

</div>

<!-- ================= ADD BOOK FORM ================= -->
<center>
<div id="addBookSection" style="display:none;">

<form method="POST" action="/admin/add-book">

<div style="margin-bottom:10px;">
Title* <br>
<input type="text" name="title" required style="width:100%;">
</div>

<div style="margin-bottom:10px;">
Author* <br>
<input type="text" name="authors" required style="width:100%;">
</div>

<div style="margin-bottom:10px;">
Publisher* <br>
<input type="text" name="publisher" required style="width:100%;">
</div>

<div style="margin-bottom:10px;">
Age Group <br>
<input type="text" name="agegroup" style="width:100%;">
</div>

<div style="margin-bottom:10px;">
Language* <br>
<input type="text" name="language" required style="width:100%;">
</div>

<div style="margin-bottom:10px;">
Popularity* <br>
<input type="number" name="popularity" required style="width:100%;">
</div>

<div style="margin-bottom:10px;">
Genre* <br>
<input type="text" name="genre" required style="width:100%;">
</div>

<div style="margin-bottom:10px;">
Mood* <br>
<select name="mood" style="width:100%;">
{% for m in moods %}
<option value="{{ m }}">{{ m }}</option>
{% endfor %}
</select>
</div>

<div style="margin-bottom:10px;">
Pages <br>
<input type="number" name="pages" style="width:100%;">
</div>

<div style="margin-bottom:10px;">
ISBN* <br>
<input type="text" name="isbn" required style="width:100%;">
</div>

<div style="margin-bottom:10px;">
Description <br>
<textarea name="description" rows="4" style="width:100%;"></textarea>
</div>

<button type="submit" style="padding:20px 20px;font-weight:bold;">
Add Book
</button>

</form>

</div>

</div>
</center>
<script>

function showAddBook(){
document.getElementById("addBookSection").style.display="block"
document.getElementById("newBooksSection").style.display="none"
}

function showNewBooks(){
document.getElementById("addBookSection").style.display="none"
document.getElementById("newBooksSection").style.display="block"
}

</script>
