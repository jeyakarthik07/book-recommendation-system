{% include "navbar.html" %}

<style>

/* BACKGROUND */
body{
    font-family:Arial;

    background-image: url("{{ url_for('static', filename='images/shelf.jpg') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* OVERLAY */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);
    z-index:-1;
}

/* MAIN CONTAINER */
.container{
    margin-top:120px;
    padding:30px;
    max-width:1000px;
    margin-left:auto;
    margin-right:auto;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);

    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    color:white;
}

/* TITLE */
h2{
    text-align:center;
    margin-bottom:20px;
}

/* TOP BUTTONS */
.panel{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:25px;
}

.panel button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;

    background: rgba(255,255,255,0.3);
    color:white;
}

.panel button:hover{
    background: rgba(255,255,255,0.6);
}

/* TABLE */
table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 10px;
}

th{
    background: rgba(255,255,255,0.2);
    padding:10px;
    border-radius:8px;
}

td{
    background: rgba(255,255,255,0.1);
    padding:12px;
}

tr:hover td{
    background: rgba(255,255,255,0.25);
}

/* LINKS */
a{
    color:#4dd0e1;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    text-decoration:underline;
}

/* ACTION BUTTONS */
.action-btn{
    padding:5px 10px;
    border-radius:6px;
    text-decoration:none;
    font-weight:bold;
}

.edit-btn{
    background:#facc15;
    color:black;
}

.delete-btn{
    background:#ef4444;
    color:white;
}

/* FORM */
form{
    max-width:600px;
    margin:auto;
    text-align:left;
}

/* INPUTS */
input, select, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
}

/* FORM BUTTON */
form button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;

    background: rgba(255,255,255,0.3);
    color:white;
}

form button:hover{
    background: rgba(255,255,255,0.6);
}

</style>

<div class="container">

<h2>📚 Book Management</h2>

<!-- PANEL -->
<div class="panel">

<button onclick="showNewBooks()">📖 New Books</button>

<button onclick="showAddBook()">➕ Add New Book</button>

</div>

<!-- ================= NEW BOOKS TABLE ================= -->

<div id="newBooksSection">

<table>

<tr>
<th>Book</th>
<th>Edit</th>
<th>Delete</th>
</tr>

{% for book in books %}

<tr>

<td>
<a href="/book/{{ book.isbn }}">
{{ book.title }}
</a>
</td>

<td>
<a href="/admin/delete-book/{{ book.id }}"
onclick="return confirm('Delete this book and re-add with changes?')"
class="action-btn edit-btn">
Edit
</a>
</td>

<td>
<a href="/admin/delete-book/{{ book.id }}"
onclick="return confirm('Delete this book?')"
class="action-btn delete-btn">
Delete
</a>
</td>

</tr>

{% endfor %}

</table>

</div>

<!-- ================= ADD BOOK FORM ================= -->

<div id="addBookSection" style="display:none;">

<form method="POST" action="/admin/add-book">

<div>
Title* <br>
<input type="text" name="title" required>
</div>

<div>
Author* <br>
<input type="text" name="authors" required>
</div>

<div>
Publisher* <br>
<input type="text" name="publisher" required>
</div>

<div>
Age Group <br>
<input type="text" name="agegroup">
</div>

<div>
Language* <br>
<input type="text" name="language" required>
</div>

<div>
Popularity* <br>
<input type="number" name="popularity" required>
</div>

<div>
Genre* <br>
<input type="text" name="genre" required>
</div>

<div>
Mood* <br>
<select name="mood">
{% for m in moods %}
<option value="{{ m }}">{{ m }}</option>
{% endfor %}
</select>
</div>

<div>
Pages <br>
<input type="number" name="pages">
</div>

<div>
ISBN* <br>
<input type="text" name="isbn" required>
</div>

<div>
Description <br>
<textarea name="description" rows="4"></textarea>
</div>

<button type="submit">
Add Book
</button>

</form>

</div>

</div>

<script>

function showAddBook(){
document.getElementById("addBookSection").style.display="block"
document.getElementById("newBooksSection").style.display="none"
}

function showNewBooks(){
document.getElementById("addBookSection").style.display="none"
document.getElementById("newBooksSection").style.display="block"
}

</script>
