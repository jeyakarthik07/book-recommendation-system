<!DOCTYPE html>
<html>
<head>
<title>Login | MiniBooks</title>

<style>
body{
    font-family:Arial;
    text-align:center;

    /* Background Image */
    background-image: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
     background-attachment: fixed;
}

/* Dark overlay */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);
    z-index:-1;
}

h1{
    margin-top:40px;
    color: antiquewhite;
    letter-spacing:2px;
}

/* Glass container */
.container{
    width:550px;
    margin:70px auto;
    padding:40px;
    border-radius:25px;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    color:white;
}

.section-title{
    font-size:22px;
    margin-bottom:25px;
    font-weight:bold;
}

.form-group{
    text-align:left;
    margin-bottom:18px;
}

label{
    font-weight:bold;
}

/* Input Fix */
input{
    width:100%;
    padding:12px;
    margin-top:5px;
    font-size:15px;
    box-sizing:border-box;
    border:none;
    border-radius:8px;
}

/* Buttons */
button.main-btn{
    padding:12px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
    border:none;
    border-radius:10px;
    transition:0.3s;

    background: rgba(255,255,255,0.3);
    color:white;
    backdrop-filter: blur(5px);
}

/* Hover */
button.main-btn:hover{
    background: rgba(255,255,255,0.6);
    transform:scale(1.05);
}

/* Error */
.error{
    color:red;
    margin-top:15px;
}

.hidden{
    display:none;
}

/* Password Eye */
.password-wrapper{
    position:relative;
}

.password-wrapper input{
    padding-right:40px;
}

.eye-icon{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
    color:black;
}

/* Button Layout Fix */
.button-row{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.button-row .main-btn{
    flex:1;
    max-width:200px;
}

/* Create Account Button */
.bottom-btn{
    margin-top:25px;
    color:white;
    cursor:pointer;
    font-weight:bold;
    text-align:center;
    padding:10px;
    border-radius:10px;
    width:200px;
    margin-left:auto;
    margin-right:auto;
    transition:0.3s;
}

.bottom-btn:hover{
    background: rgba(255,255,255,0.3);
}

</style>

<script>

function togglePassword(id, icon){
    let input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁️";
    }
}

function showRegister(){
    document.getElementById("loginForm").classList.add("hidden")
    document.getElementById("registerForm").classList.remove("hidden")
}

function showLogin(){
    document.getElementById("registerForm").classList.add("hidden")
    document.getElementById("loginForm").classList.remove("hidden")
}

</script>

</head>

<body>

<h1>-----MiniBooks-----</h1>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginForm">

<div class="section-title">User Login</div>

<form method="POST" action="/login">

<div class="form-group">
<label>Email :</label>
<input type="email" name="user_id">
</div>

<div class="form-group">
<label>Password :</label>
<div class="password-wrapper">
<input type="password" name="password" id="loginPassword">
<span class="eye-icon" onclick="togglePassword('loginPassword', this)">👁️</span>
</div>
</div>

<div class="button-row">

<button type="submit" class="main-btn">Login</button>

<a href="/guest-login">
<button type="button" class="main-btn">Guest</button>
</a>

</div>

<div class="bottom-btn" onclick="showRegister()">
Create new Account
</div>

</div>
</form>

<!-- ================= REGISTER ================= -->

<div id="registerForm" class="hidden">

<div class="section-title">Create a New Account</div>

<form method="POST" action="/register">

<div class="form-group">
<label>Email :</label>
<input type="email" name="user_id" required>
</div>

<div class="form-group">
<label>User Name :</label>
<input type="text" name="username" required>
</div>

<div class="form-group">
<label>Password :</label>
<div class="password-wrapper">
<input type="password" name="password" id="registerPassword">
<span class="eye-icon" onclick="togglePassword('registerPassword', this)">👁️</span>
</div>
</div>

<div class="form-group">
<label>Confirm Password :</label>
<div class="password-wrapper">
<input type="password" name="confirm" id="confirmPassword">
<span class="eye-icon" onclick="togglePassword('confirmPassword', this)">👁️</span>
</div>
</div>

<button class="main-btn">Create Account</button>

</form>

<div class="bottom-btn" onclick="showLogin()">
Back to Login 🔙
</div>

</div>


<!-- FLASH MESSAGES -->

{% with messages = get_flashed_messages() %}

{% if messages %}

<div class="error">

{% for msg in messages %}
<p>{{ msg }}</p>
{% endfor %}

</div>

{% endif %}

{% endwith %}

</div>

</body>
</html>
