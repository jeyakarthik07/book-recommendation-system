<!DOCTYPE html>
<html>
<head>
<title>Login | MiniBooks</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    text-align:center;
}

h1{
    margin-top:40px;
}

.container{
    width:550px;
    margin:70px auto;
    background:#dcdcdc;
    padding:40px;
    border-radius:25px;
}

.section-title{
    font-size:22px;
    margin-bottom:25px;
    font-weight:bold;
}

.form-group{
    text-align:left;
    margin-bottom:15px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    font-size:15px;
}

button.main-btn{
    width:100%;
    padding:12px;
    margin-top:15px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.link-btn{
    cursor:pointer;
    color:blue;
    text-decoration:underline;
    margin-top:15px;
    display:inline-block;
}

.error{
    color:red;
    margin-top:15px;
}

.hidden{
    display:none;
}

</style>

<script>

function showRegister(){
    document.getElementById("loginForm").classList.add("hidden")
    document.getElementById("registerForm").classList.remove("hidden")
}

function showLogin(){
    document.getElementById("registerForm").classList.add("hidden")
    document.getElementById("loginForm").classList.remove("hidden")
}

</script>

</head>

<body>

<h1>-----MiniBooks-----</h1>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginForm">

<div class="section-title">User Login</div>

<form method="POST" action="/login">

<div class="form-group">
<label>Email :</label>
<input type="email" name="user_id">
</div>

<div class="form-group">
<label>Password :</label>
<input type="password" name="password">
</div>

<button class="main-btn">LOGIN</button>

</form>

<br>

<a href="/guest-login">
<button type="button" class="main-btn">Continue as Guest</button>
</a>

<div class="link-btn" onclick="showRegister()">
Create Account
</div>

</div>


<!-- ================= REGISTER ================= -->

<div id="registerForm" class="hidden">

<div class="section-title">Create a New Account</div>

<form method="POST" action="/register">

<div class="form-group">
<label>Email :</label>
<input type="email" name="user_id" required>
</div>

<div class="form-group">
<label>User Name :</label>
<input type="text" name="username" required>
</div>

<div class="form-group">
<label>Password :</label>
<input type="password" name="password" required>
</div>

<div class="form-group">
<label>Confirm Password :</label>
<input type="password" name="confirm" required>
</div>

<button class="main-btn">Create Account</button>

</form>

<div class="link-btn" onclick="showLogin()">
Back to Login 🔙
</div>

</div>


<!-- FLASH MESSAGES -->

{% with messages = get_flashed_messages() %}

{% if messages %}

<div class="error">

{% for msg in messages %}
<p>{{ msg }}</p>
{% endfor %}

</div>

{% endif %}

{% endwith %}

</div>

</body>
</html>
